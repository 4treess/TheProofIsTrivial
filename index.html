<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" 
    onload="renderMathInElement(document.body);"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Proof Is Trivial</title>
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-green: #10b981;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
        }

        .katex-error {
            color: inherit !important; /* Forces red text to be normal color */
            background: none !important;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        pre {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        nav {
            background-color: #111827;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            border-bottom: 1px solid #334155;
        }

        .logo {
            font-weight: bold;
            font-size: 1.5rem;
            color: var(--accent-blue);
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dim);
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--text-main);
        }

        .active-page {
            color: var(--accent-green) !important;
            font-weight: bold;
            border-bottom: 2px solid var(--accent-green);
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: var(--card-bg);
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.5);
            z-index: 1;
            border-radius: 8px;
            margin-top: 10px;
        }

        .dropdown-content a {
            color: white;
            padding: 12px 16px;
            display: block;
        }

        .dropdown-content a:hover {
            background-color: #334155;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        /* Main Layout */
        .container {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 20px;
            padding: 40px 5%;
            flex-grow: 1;
            align-items: start;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: sticky;
            top: 20px;
            height: fit-content; 
            align-self: start;
        }

        .joke-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            font-style: italic;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .math-img {
            width: 100%;
            border-radius: 12px;
            opacity: 0.7;
            transition: 0.5s;
        }

        .math-img:hover { opacity: 1; }

        .generator-box {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        h1 { margin-top: 0; color: var(--accent-blue); }

        textarea {
            width: 100%;
            height: 150px;
            background: #0f172a;
            color: #fff;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
            resize: vertical;
        }

        .btn-container {
            text-align: center;
            margin: 25px 0;
        }

        #generateBtn {
            background-color: var(--accent-green);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
        }

        #generateBtn:hover {
            transform: scale(1.05);
            background-color: #059669;
        }

        #outputArea {
            min-height: 100px;
            background: #111827;
            padding: 20px;
            border-left: 4px solid var(--accent-blue);
            border-radius: 4px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-dim);
            font-size: 0.8rem;
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .math-input {
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
        }

        .secondary-btn {
            background: transparent;
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .secondary-btn:hover {
            background: var(--accent-blue);
            color: #0f172a;
        }

        .status-msg {
            font-size: 0.85rem;
            margin-top: 5px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <script type="text/babel" src="./Users.js"></script>
    <script type="text/babel" src="./Proofs.js"></script>
    <script type="text/babel" src="./Login.js"></script>
    <script type="text/babel" src="./App.js"></script>



    <main id="root"></main>

    <footer>
        &copy; 2026 The Proof is Trivial. All rights reserved. No axioms were harmed in the making of this site.
    </footer>

    <script type="text/babel">
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App/>) 
    </script>

    
</body>
</html>
